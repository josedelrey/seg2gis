[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seg2gis"
version = "1.0.0"
description = "Building footprint segmentation and georeferenced vector export"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "José del Rey Ortega" },
]
keywords = [
    "building-footprints",
    "deep-learning",
    "geospatial",
    "image-segmentation",
    "remote-sensing",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "albumentations>=2.0,<2.1",
    "geopandas>=1.0,<1.2",
    "matplotlib>=3.9,<3.11",
    "numpy>=2.0,<2.5",
    "opencv-python-headless>=4.10,<5",
    "pillow>=10,<13",
    "pyyaml>=6.0,<7",
    "rasterio>=1.4,<1.5",
    "scikit-learn>=1.6,<1.9",
    "shapely>=2.0,<2.2",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
cpu = [
    "segmentation-models-pytorch>=0.5,<0.6",
    "torch>=2.13,<2.14",
    "torchvision>=0.28,<0.29",
]
cuda126 = [
    "segmentation-models-pytorch>=0.5,<0.6",
    "torch>=2.13,<2.14",
    "torchvision>=0.28,<0.29",
]

[project.urls]
Homepage = "https://github.com/josedelrey/seg2gis"
Issues = "https://github.com/josedelrey/seg2gis/issues"
Repository = "https://github.com/josedelrey/seg2gis.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["seg2gis*"]
namespaces = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # Core Python errors
    "I", "B", "UP", "C4", "RUF",  # Imports and common correctness checks
    "BLE001", "DTZ005", "PIE810", "PLR1704", "TRY004",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda126" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda126" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
