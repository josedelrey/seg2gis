name: Ubuntu tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      NO_ALBUMENTATIONS_UPDATE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.12'
          python-version: '3.11'
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked --extra cpu
      - name: Check dependency compatibility
        run: uv pip check
      - name: Run tests
        run: uv run --locked --extra cpu python -m unittest discover -s tests -v
      - name: Check inference CLI
        run: uv run --locked --extra cpu python scripts/predict_full_image.py --help
      - name: Check training and evaluation CLIs
        run: |
          uv run --locked --extra cpu python -m seg2gis.train --help
          uv run --locked --extra cpu python -m seg2gis.evaluate --help
